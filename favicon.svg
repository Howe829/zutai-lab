<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <linearGradient id="zt-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0ff"/><stop offset="1" stop-color="#2f9bf7"/>
    </linearGradient>
    <linearGradient id="zt-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86f6"/><stop offset="1" stop-color="#1557c9"/>
    </linearGradient>
    <linearGradient id="zt-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4fb0"/><stop offset="1" stop-color="#0c2f78"/>
    </linearGradient>
  </defs>
  <!-- 等轴测立方体：三个面留缝 -->
  <polygon points="32,6 54,18.7 32,31.4 10,18.7" fill="url(#zt-top)"/>
  <polygon points="8.5,21.3 30.5,34 30.5,59 8.5,46.3" fill="url(#zt-left)"/>
  <polygon points="33.5,34 55.5,21.3 55.5,46.3 33.5,59" fill="url(#zt-right)"/>
  <!-- 流程管线：左面进、右面出 -->
  <path d="M13 30.5 L13 40.2 L28.4 49.1" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35.6 49.1 L50.5 40.5" fill="none" stroke="#5fe0ff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M45.8 38.6 L51.6 39.7 L49.4 45.1" fill="none" stroke="#5fe0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 顶面监测节点 -->
  <ellipse cx="32" cy="18.7" rx="6.4" ry="3.7" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <ellipse cx="32" cy="18.7" rx="2.2" ry="1.3" fill="#ffffff"/>
</svg>
